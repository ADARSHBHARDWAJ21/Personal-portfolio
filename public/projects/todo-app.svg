<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Todo App — source-based project preview</title>
  <desc id="description">A project illustration based on the public Todo App source, showing adding, editing, completing and deleting tasks. This is not an application screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151617"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="1095" cy="77" r="255" fill="#3b82f6" opacity=".055"/>
  <circle cx="80" cy="735" r="290" fill="#10b981" opacity=".035"/>
  <path d="M620 110V610" stroke="#334155" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="74" y="85" width="285" height="32" rx="16" fill="#3b82f6" opacity=".12"/>
    <text x="91" y="106" fill="#60a5fa" font-size="12" letter-spacing="1.3">SOURCE-BASED PROJECT PREVIEW</text>
    <rect x="74" y="167" width="90" height="90" rx="24" fill="url(#primary)"/>
    <path d="M99 211l15 16 26-31" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="345" fill="#f1f5f9" font-size="72" font-weight="700" letter-spacing="-2">Todo App</text>
    <text x="77" y="395" fill="#94a3b8" font-size="25">Mobile task organizer</text>
    <text x="77" y="451" fill="#cbd5e1" font-size="20">Add. Edit. Complete. Repeat.</text>
    <g font-size="14" fill="#cbd5e1">
      <rect x="76" y="501" width="130" height="39" rx="9" fill="#1e293b" stroke="#334155"/><text x="94" y="526">React Native</text>
      <rect x="218" y="501" width="76" height="39" rx="9" fill="#1e293b" stroke="#334155"/><text x="238" y="526">Expo</text>
      <rect x="306" y="501" width="119" height="39" rx="9" fill="#1e293b" stroke="#334155"/><text x="324" y="526">TypeScript</text>
      <rect x="437" y="501" width="92" height="39" rx="9" fill="#1e293b" stroke="#334155"/><text x="456" y="526">Convex</text>
    </g>
    <text x="77" y="600" fill="#64748b" font-size="14">Based on the public task-management components.</text>
    <text x="77" y="625" fill="#64748b" font-size="14">Illustration · not an app screenshot</text>
    <text x="680" y="154" fill="#94a3b8" font-size="13" letter-spacing="2">TASK WORKFLOW</text>
    <g>
      <rect x="679" y="187" width="526" height="94" rx="18" fill="url(#surface)" stroke="#475569" stroke-opacity=".6"/>
      <rect x="704" y="211" width="45" height="45" rx="12" fill="url(#primary)"/><path d="M718 233h17m-8.5-8.5v17" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="773" y="229" fill="#f1f5f9" font-size="22" font-weight="600">Create a task</text><text x="773" y="254" fill="#94a3b8" font-size="15">Capture what needs to be done</text>
      <rect x="679" y="298" width="526" height="94" rx="18" fill="url(#surface)" stroke="#475569" stroke-opacity=".6"/>
      <rect x="704" y="322" width="45" height="45" rx="12" fill="#f59e0b" fill-opacity=".2"/><path d="M719 352l1-7 12-12 6 6-12 12z" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <text x="773" y="340" fill="#f1f5f9" font-size="22" font-weight="600">Edit the details</text><text x="773" y="365" fill="#94a3b8" font-size="15">Update text and save changes</text>
      <rect x="679" y="409" width="526" height="94" rx="18" fill="url(#surface)" stroke="#475569" stroke-opacity=".6"/>
      <rect x="704" y="433" width="45" height="45" rx="12" fill="url(#success)"/><path d="M716 455l8 8 14-17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="773" y="451" fill="#f1f5f9" font-size="22" font-weight="600">Mark it complete</text><text x="773" y="476" fill="#94a3b8" font-size="15">Toggle completion with one action</text>
      <rect x="679" y="520" width="526" height="94" rx="18" fill="url(#surface)" stroke="#475569" stroke-opacity=".6"/>
      <rect x="704" y="544" width="45" height="45" rx="12" fill="#ef4444" fill-opacity=".18"/><path d="M718 559h18m-15-4h12m-12 8 1 14h11l1-14" stroke="#f87171" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="773" y="562" fill="#f1f5f9" font-size="22" font-weight="600">Remove a task</text><text x="773" y="587" fill="#94a3b8" font-size="15">Delete with a confirmation prompt</text>
    </g>
  </g>
</svg>
